name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build, test, and package
        shell: pwsh
        run: .\build.ps1 -Msi -Version $env:RELEASE_VERSION

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts\release" | Out-Null
          Copy-Item "artifacts\publish\win-x64\PromptlyHash.exe" "artifacts\release\PromptlyHash.exe"
          Copy-Item "installer\bin\x64\Release\PromptlyHash-Setup.msi" "artifacts\release\PromptlyHash-Setup.msi"
          Get-FileHash "artifacts\release\PromptlyHash.exe","artifacts\release\PromptlyHash-Setup.msi" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "artifacts\release\SHA256SUMS.txt"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts\release\PromptlyHash.exe" `
            "artifacts\release\PromptlyHash-Setup.msi" `
            "artifacts\release\SHA256SUMS.txt" `
            --title "PromptlyHash ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
