name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test Windows packages
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and package
        shell: pwsh
        run: .\build.ps1 -Msi

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            "artifacts\publish\win-x64\PromptlyHash.exe",
            "installer\bin\x64\Release\PromptlyHash-Setup.msi"
          )
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "artifacts\SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PromptlyHash-windows
          if-no-files-found: error
          path: |
            artifacts/publish/win-x64/PromptlyHash.exe
            installer/bin/x64/Release/PromptlyHash-Setup.msi
            artifacts/SHA256SUMS.txt
